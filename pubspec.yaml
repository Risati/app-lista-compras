name: lista_elegante
description: Uma aplicação Flutter elegante para gerenciar sua lista de compras.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.3.1
  cupertino_icons: ^1.0.2
  mobile_scanner: ^7.0.1
  http: ^1.5.0
  intl: ^0.20.2
  flutter_slidable: ^4.0.1
  pdf: ^3.10.7
  path_provider: ^2.1.2
  open_file: ^3.3.2
  diacritic: ^0.1.3
  share_plus: ^11.1.0
  currency_text_input_formatter: ^2.1.10
  flutter_multi_formatter: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png